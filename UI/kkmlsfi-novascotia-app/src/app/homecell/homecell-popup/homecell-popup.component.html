<div class="backdrop" (click)="onCancel()"></div>
<dialog class="dialog" open>
    <h3>{{mode}} Homecell</h3>

    <form (submit)="onFormSubmit()">
        <div class="mt-2">
            <div class="mt-3">
                <label class="form-label" for="date">Date</label>
                <input type="date" id="date" class="form-control" name="date" >
            </div>

            <div class="mt-3">
                <label class="form-label" for="city">City</label>
                <input type="text" id="city" class="form-control" name="city">
            </div>

            <div class="mt-3">
                <label class="form-label" for="openingPrayer">Opening Prayer</label>
                <select class="form-select" id="openingPrayer">
                    <option selected [value]="0">--Select a member--</option>
                </select>
            </div>

            <div class="mt-3">
                <label class="form-label" for="location">Location</label>
                <select class="form-select" id="location">
                    <option selected [value]="0">--Select a member--</option>
                </select>
            </div>

            <div class="mt-3">
                <label class="form-label" for="teacher">Teacher</label>
                <select class="form-select" id="teacher">
                    <option selected [value]="0">--Select a member--</option>
                </select>
            </div>

            <div class="mt-3">
                <label class="form-label" for="pnw">Praise and Worship</label>
                <select class="form-select" id="pnw">
                    <option selected [value]="0">--Select a member--</option>
                </select>
            </div>

            <div class="mt-3 d-flex justify-content-end gap-1">
                <button type="submit" class="btn btn-primary">Save</button>
                <button type="button" class="btn btn-outline-primary" (click)="onCancel()">Cancel</button>
            </div>
        </div>
    </form>
</dialog>
